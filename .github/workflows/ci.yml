name: CI Pipeline

on:
  push:
    branches: [ main, feature/**, feat/**, docs/**, fix/** ]
  pull_request:
    branches: [ main ]

jobs:
  python-test-and-audit:
    name: Python Tests & Provenance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify Provenance Manifest
        run: |
          python scripts/audit_provenance.py

      - name: Run Hermetic Pytest Suite
        run: |
          pytest tests/ -v

      - name: Verify Clean Git Status After Tests
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  frontend-lint-and-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js Production Bundle
        run: npm run build
